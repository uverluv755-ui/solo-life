name: Verify SOLO LIFE v0.8
on:
  push:
    branches: [verify/v0.8-goal-quests]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx --no-install playwright install --with-deps webkit
      - run: npm run test:browser
